name: CloudOps CI

on:
    push:
      branches:
        - main
    pull_request:
      branches:
        - main
      types:
        - opened
        - synchronize
        - reopened
permissions:
  contents: read
jobs:
  test:
    name: Run API tests
    runs-on: ubuntu-latest

    steps:
      - name: checkout repositories
        uses: actions/checkout@v4
      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v
  build-image:
    name: Build docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: checkout repositories
        uses: actions/checkout@v4

      - name: build docker image
        run: docker build -t cloudops-api:ci .

      - name: verify docker image
        run: docker image inspect cloudops-api:ci

  push-to-ecr:
    name: Push docker image to ECR
    # if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main')
    # if: github.event.pull_request.merged == true
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, build-image]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      # - name: Debug Github OIDC claims
      #   uses: actions/github-script@v7
      #   with:
      #     script: |
      #       const token = await core.getIDToken('sts.amazonaws.com');
      #       const payload = JSON.parse(
      #         Buffer.from(token.split('.')[1], 'base64url').toString()
      #       );
      #       core.info(`OIDC Subject: ${payload.sub}`);
      #       core.info(`OIDC Audience: ${payload.aud}`);

      - name: configure Aws credentials using AWS OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{vars.AWS_ROLE_ARN}}
          aws-region: ${{vars.AWS_REGION}}
      - name: Login to amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and tag image
        env:
          ECR_REGISTRY: ${{steps.login-ecr.outputs.registry}}
          ECR_REPOSITORY: ${{vars.ECR_REPOSITORY}}
          IMAGE_TAG: ${{github.sha}}

        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Push image to ECR
        env:
          ECR_REGISTRY: ${{steps.login-ecr.outputs.registry}}
          ECR_REPOSITORY: ${{vars.ECR_REPOSITORY}}
          IMAGE_TAG: ${{github.sha}}
        # shell: bash
        run: |
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
  deploy-to-kubernetes:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: push-to-ecr
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Send deployment command through SSM
        id: deploy
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids i-0cb51ae1571643d04 \
            --document-name CloudOpsDeployApi \
            --parameters "{\"ImageTag\":[\"${IMAGE_TAG}\"]}" \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command submitted: $COMMAND_ID"

      - name: Wait for deployment
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            RESULT=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id i-0cb51ae1571643d04 \
              --output json 2>/dev/null) || {
                sleep 5
                continue
              }

            STATUS=$(echo "$RESULT" | jq -r '.Status')
            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "$RESULT" | jq -r '.StandardOutputContent'
                exit 0
                ;;
              Failed|Cancelled|TimedOut|DeliveryTimedOut|Undeliverable)
                echo "$RESULT" | jq -r \
                  '.StandardOutputContent, .StandardErrorContent'
                exit 1
                ;;
              *)
                sleep 5
                ;;
            esac
          done

          echo "Timed out waiting for the SSM deployment command."
          exit 1
